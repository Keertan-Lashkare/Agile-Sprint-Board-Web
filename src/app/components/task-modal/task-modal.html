<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <h2 class="modal-title">{{ isEditMode ? 'Edit Task' : 'Create Task' }}</h2>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <input
          type="text"
          formControlName="title"
          placeholder="Task title"
          [class.has-error]="taskForm.get('title')?.touched && taskForm.get('title')?.invalid"
        >
      </div>

      <div class="field">
        <textarea
          formControlName="description"
          placeholder="Task description"
          rows="4"
          [class.has-error]="taskForm.get('description')?.touched && taskForm.get('description')?.invalid"
        ></textarea>
      </div>

      <div class="grid-fields">
        <div class="field">
          <label class="field-label">Priority</label>
          <select formControlName="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label">Due Date</label>
          <input type="date" formControlName="dueDate">
        </div>
      </div>

      <div class="checkbox-field">
        <label>
          <input type="checkbox" formControlName="assignToTeammate">
          <span class="custom-checkbox"></span>
          <span class="checkbox-label">Assign to a teammate</span>
        </label>
      </div>

      <div class="field teammate-select-field" *ngIf="taskForm.get('assignToTeammate')?.value">
        <label class="field-label">Teammate</label>
        <select formControlName="assignedTo">
          <option value="">-- Select Teammate --</option>
          <option *ngFor="let user of users" [value]="user.id">
            {{ user.name }} ({{ user.email }})
          </option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" (click)="onCancel()" class="btn-secondary">Cancel</button>
        <button type="submit" [disabled]="taskForm.invalid || isLoading" class="btn-primary">
          {{ isLoading ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Save Changes' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
