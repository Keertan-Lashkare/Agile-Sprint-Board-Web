<div class="auth-wrapper">
  <div class="auth-box">
    <h1 class="logo">Bi<span>CXO</span> Sprint Board</h1>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Email address"
          [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
      </div>

      <div class="field password-wrapper">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          formControlName="password" 
          placeholder="Password"
          [class.has-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        >
        <button type="button" class="toggle-btn" (click)="togglePassword()">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-submit">
        {{ isLoading ? 'Loading...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-switch">
      New here? <a routerLink="/register">Create an account</a>
    </div>
  </div>
</div>
